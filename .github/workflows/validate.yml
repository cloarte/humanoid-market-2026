name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests charts datawrapper analysis
      - name: Format
        run: ruff format --check src tests charts datawrapper analysis
      - name: Tests
        run: python -m pytest -q
      - name: Validate data
        run: python -m src.validate
